{{- if .Values.glaceonModule.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: glaceon-backend-service
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: glaceon-backend
  ports:
    - port: {{ .Values.glaceonModule.backend.servicePort }}
      targetPort: {{ .Values.glaceonModule.backend.containerPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glaceon-backend-deployment
  labels:
    app: glaceon-backend
    tier: backend
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.glaceonModule.backend.replicas }}
  selector:
    matchLabels:
      app: glaceon-backend
  template:
    metadata:
      labels:
        app: glaceon-backend
    spec:
      # Same ServiceAccount as assignment-runner: this backend spawns the
      # exact same kind of Kubernetes Job and needs the same job-manager-role
      # (see templates/assignment-runner.yaml). It gets NO database access —
      # no eevee.appEnv here, by design (the module never touches EEVEE's DB).
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: glaceon-backend
          image: "{{ .Values.glaceonModule.backend.image.repository }}:{{ .Values.glaceonModule.backend.image.tag }}"
          imagePullPolicy: {{ .Values.glaceonModule.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.glaceonModule.backend.containerPort }}
          env:
            - name: ENV
              value: {{ .Values.glaceonModule.backend.env | quote }}
            - name: PORT
              value: {{ .Values.glaceonModule.backend.containerPort | quote }}
            - name: EEVEE_LEARNING_INTEGRATION_URL
              value: {{ .Values.glaceonModule.backend.integrationUrl | quote }}
            - name: GLACEON_MODULE_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: LEARNING_MODULE_CREDENTIAL_TERRAFORM_ANSIBLE_PRACTICE
            - name: WORKER_BOOTSTRAP_IMAGE
              value: {{ include "eevee.latestWorkerImage" .Values.glaceonModule.images.bootstrap | quote }}
            - name: WORKER_IMAGE_TERRAFORM
              value: {{ include "eevee.latestWorkerImage" .Values.glaceonModule.images.terraformDefault | quote }}
            - name: WORKER_IMAGE_ANSIBLE
              value: {{ include "eevee.latestWorkerImage" .Values.glaceonModule.images.ansibleDefault | quote }}
            {{- include "eevee.jobRuntimeEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.glaceonModule.backend.resources | nindent 12 }}
      {{- include "eevee.imagePullSecrets" . | nindent 6 }}
      {{- include "eevee.nodeSelector" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: glaceon-frontend-service
  labels:
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: glaceon-frontend
  ports:
    - port: {{ .Values.glaceonModule.frontend.servicePort }}
      targetPort: {{ .Values.glaceonModule.frontend.containerPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glaceon-frontend-deployment
  labels:
    app: glaceon-frontend
    tier: frontend
    {{- include "eevee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.glaceonModule.frontend.replicas }}
  selector:
    matchLabels:
      app: glaceon-frontend
  template:
    metadata:
      labels:
        app: glaceon-frontend
    spec:
      containers:
        - name: glaceon-frontend
          image: "{{ .Values.glaceonModule.frontend.image.repository }}:{{ .Values.glaceonModule.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.glaceonModule.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.glaceonModule.frontend.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.glaceonModule.frontend.containerPort | quote }}
            - name: GLACEON_BACKEND_URL
              value: "http://glaceon-backend-service:{{ .Values.glaceonModule.backend.servicePort }}"
          resources:
            {{- toYaml .Values.glaceonModule.frontend.resources | nindent 12 }}
      {{- include "eevee.imagePullSecrets" . | nindent 6 }}
      {{- include "eevee.nodeSelector" . | nindent 6 }}
{{- end }}
